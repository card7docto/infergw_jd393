[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "card7docto-infergw_jd393"
version = "0.1.0"
description = "通过字符级与结构级特征识别推理网关架构师·数据去重与污染检测的痕迹，给出密度与命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "card7docto" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://card7docto.github.io"
Repository = "https://github.com/card7docto/infergw_jd393"
Issues = "https://github.com/card7docto/infergw_jd393/issues"

[project.scripts]
infergw_jd393 = "infergw_jd393:main"

[tool.setuptools]
py-modules = ["infergw_jd393"]
